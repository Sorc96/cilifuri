<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čilifuri kvíz</title>
  <link rel="stylesheet" href="kviz.css">
  <script src="kviz.js" defer></script>
</head>

<body>
  <section id="start-screen" class="screen">
    <h1>Čilifuri kvíz</h1>
    <video class="decoration" src="assets/video/horici_panev.mp4" autoplay muted loop playsinline
      aria-hidden="true"></video>
    <div id="episodes" class="choice" role="group" aria-label="Díly">
      Recepty:
      <button data-episodes="new" aria-pressed="true">Novější</button>
      <button data-episodes="old" aria-pressed="false">Starší</button>
    </div>
    <div id="part-size" class="choice" role="group" aria-label="Počet receptů">
      Počet receptů:
      <button data-size="10" aria-pressed="false">10</button>
      <button data-size="25" aria-pressed="true">25</button>
      <button data-size="50" aria-pressed="false">50</button>
    </div>
    <button id="start" class="face-button"><img src="assets/images/sapik.webp" alt="">Začít</button>
  </section>

  <section id="video-screen" hidden>
    <video id="video" playsinline preload="auto"></video>
    <button id="skip">Přeskočit</button>
  </section>

  <section id="question-screen" class="screen" hidden>
    <div id="question-top">
      <button id="home">Zpět na začátek</button>
      <p id="progress"></p>
    </div>
    <img id="recipe-picture" alt="Obrázek receptu">
    <div id="answers">
      <div id="choices"></div>
      <button id="next" hidden>Další</button>
    </div>
  </section>

  <section id="score-screen" class="screen" hidden>
    <h1 id="score-title"></h1>
    <video class="decoration" src="assets/video/sapikovice.mp4" autoplay muted loop playsinline
      aria-hidden="true"></video>
    <p id="score"></p>
    <p id="total" hidden></p>
    <div class="score-buttons">
      <button id="continue" class="face-button"><img src="assets/images/sapik.webp" alt="">Další část</button>
      <button id="back" class="face-button"><img src="assets/images/babica.webp" alt="">Zpět na začátek</button>
    </div>
  </section>
</body>

</html>
